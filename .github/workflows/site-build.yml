name: Build website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 scripts/test-research-workflow.py
      - run: python3 scripts/test-research-tasks.py
      - run: python3 scripts/test-research-delivery.py
      - run: npm ci
      - run: node scripts/test-public-content.mjs
      - run: node scripts/check-research-content.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: docs/.vitepress/dist
          retention-days: 7
