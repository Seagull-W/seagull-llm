<p>将策略用参数化函数表示（<span class="math-inline" data-tex="\pi (a|s,\theta)"></span>），通过优化函数参数进而最大化某个<em>标量指标</em>来得到最优策略的方法叫做<strong>策略梯度</strong>。</p>
<p>这里最优策略变为了最大化某个标量指标的策略，更新策略等价于更新参数，通过计算获取动作概率。</p>
