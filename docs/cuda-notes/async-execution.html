<p>CUDA允许多个任务的并发执行，包括主机与设备任意的计算，传输和内部传输。</p>
<p>并发性通过异步接口实现，调用在调度操作完成甚至开始前就返回，应用程序可以在调用后自由执行其他任务。想要获取调度操作的结果时，就需要进行一定的同步操作。</p>
