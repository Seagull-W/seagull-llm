<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc">
  <title id="title">让证据不足的回答停在核验环节</title><desc id="desc">明确问题范围，准备带出处的资料，生成草稿，逐条检查结论与证据。通过后交付；错位引用回到修订，资料不足则补资料或说明无法确定。</desc>
  <defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#2563eb"/></marker><marker id="stop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9a3412"/></marker></defs>
  <rect width="640" height="340" rx="12" fill="#fff"/>
  <g fill="#16233a" font-family="sans-serif" text-anchor="middle" font-size="21">
    <rect x="20" y="24" width="280" height="64" rx="8" fill="#eef3fc" stroke="#d7e1f2"/><text x="160" y="63">1　明确问题与范围</text>
    <rect x="340" y="24" width="280" height="64" rx="8" fill="#eef3fc" stroke="#d7e1f2"/><text x="480" y="63">2　准备带出处的资料</text>
    <rect x="340" y="134" width="280" height="64" rx="8" fill="#fef3c7" stroke="#a16207"/><text x="480" y="173">3　生成带引用的草稿</text>
    <rect x="20" y="134" width="280" height="64" rx="8" fill="#ecfeff" stroke="#0e7490"/><text x="160" y="173">4　逐条核验支持关系</text>
    <g fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#flow-arrow)"><path d="M300 56H330"/><path d="M480 88V124"/><path d="M340 166H310"/><path d="M160 198V235"/></g>
    <rect x="20" y="245" width="280" height="64" rx="8" fill="#f0fdf4" stroke="#15803d"/><text x="160" y="284">证据充分：交付答案</text>
    <rect x="340" y="245" width="280" height="64" rx="8" fill="#fff7ed" stroke="#9a3412"/><text x="480" y="272" font-size="19">证据不足：修订、补资料</text><text x="480" y="296" font-size="19">或明确说明无法确定</text>
    <path d="M300 185H318V229H480V235" fill="none" stroke="#9a3412" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#stop-arrow)"/>
  </g>
</svg>
