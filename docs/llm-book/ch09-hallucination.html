<ul>
<li>幻觉是大模型生成看似合理但实际错误内容的现象</li>
<li>根本原因是大模型的概率生成本质，而非 bug</li>
<li>事实性幻觉和忠实性幻觉是两种主要类型</li>
<li>RAG、提示工程、温度调节可缓解但无法完全消除幻觉</li>
</ul>
