<h2 id="assignments" tabindex="-1">作业与实现 <a class="header-anchor" href="#assignments" aria-label="章节链接">&#8203;</a></h2>
<p>A1 先训练分词器，把文本变成整数序列，再给注意力层加入位置信息。A2 用搭好的模型测量一个训练步的耗时。</p>
<ChapterCards :items="[
  { title: 'A1 · 字节级 BPE 的训练与编码', description: '从相邻字节的频数训练合并规则，用同一组规则编码新文本，再把词元还原成 UTF-8 字节。', link: '/cs336/a1-bpe' },
  { title: 'A1 · 从 RoPE 到 Transformer 块', description: '从位置索引算出旋转角度，将它用到多头注意力的 Q 和 K 上，再把注意力和前馈网络接回残差路径。', link: '/cs336/a1-transformer' },
  { title: 'A2 · GPU 计时与预热实验', description: '先写一个计时循环，再用同一个模型练习预热、重复测量，以及前向、反向和完整训练步的计时。', link: '/cs336/a2-benchmark' }
]" />
