<ChapterCards :items="[
  { label: '模型基础', title: '第 1 讲 · 分词与下一词预测', description: '把一段文本编码成整数序列，用错开一位的输入监督下一个词元，再用 BPE 缩短序列。', link: '/cs336/lecture-01' },
  { label: '模型基础', title: '第 2 讲 · 张量、显存与计算量', description: '从张量的字节数、参数与激活的四份账，到 FLOPs、算术强度和一次训练步的显存预算。', link: '/cs336/lecture-02' },

<section class="document-section note-panel" aria-labelledby="assignments">
<h2 id="assignments" tabindex="-1">作业与实现 <a class="header-anchor" href="#assignments" aria-label="章节链接">&#8203;</a></h2>
<p>A1 先训练分词器，把文本变成整数序列，再给注意力层加入位置信息。A2 用搭好的模型测量一个训练步的耗时。</p>
<ChapterCards :items="[
  { title: 'A1 · 字节级 BPE 的训练与编码', description: '手算两轮合并，按源码实现训练、编码与解码，核对频数、优先级、特殊标记与解码边界。', link: '/cs336/a1-bpe' },
  { title: 'A1 · 从 RoPE 到 Transformer 块', description: '从位置编号与旋转走到注意力、RMSNorm、SwiGLU 与残差堆叠，逐步核对形状与数值。', link: '/cs336/a1-transformer' },
  { title: 'A2 · GPU 计时与预热实验', description: '建立可信的计时协议，用本地实测解释预热与异常，再推混合精度、显存与分布式训练的账。', link: '/cs336/a2-benchmark' }
]" />
</section>
