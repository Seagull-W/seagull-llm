<script setup>
import { onMounted, ref } from 'vue'
import { withBase } from 'vitepress'
import PdfViewer from '../../.vitepress/components/PdfViewer.vue'
import outline from './outline.json'

const pdfUrl = withBase('/papers/agentic-rl-survey/arxiv-2509.02547v5-zh.pdf')
const webUrl = withBase('/papers/agentic-rl-survey/web/')
const pdfSource = ref('')
const preferWeb = ref(false)

onMounted(() => {
  preferWeb.value = matchMedia('(max-width: 679px), (max-width: 960px) and (pointer: coarse)').matches
  const { searchParams, hash } = new URL(location.href)
  const explicitPdf = searchParams.get('view') === 'pdf' || hash === '#pdf-reading' ||
    new URLSearchParams(hash.slice(1)).has('page')
  if (preferWeb.value && !explicitPdf) {
    location.replace(webUrl + hash)
    return
  }
  pdfSource.value = pdfUrl
})
</script>

<PdfViewer :src="pdfSource" title="大语言模型智能体强化学习全景：综述（中文译本）" :outline="outline"
  :back-href="preferWeb ? webUrl : withBase('/papers/')" :back-label="preferWeb ? '返回网页版' : '返回论文列表'"
  :web-href="webUrl"
  source-href="https://arxiv.org/abs/2509.02547v5" source-label="原论文 v5" />
