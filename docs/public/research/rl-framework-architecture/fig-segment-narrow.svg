<svg xmlns="http://www.w3.org/2000/svg" class="flow-narrow flow-narrow" viewBox="0 0 340 528" role="img" aria-labelledby="fig-segment-narrow-title">
<style>
  text { font-family: "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
  svg { font-size: 17px; }
  :is(.flow-wide, .flow-narrow) text { fill: #26364a;
  font: 400 17px "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
:is(.flow-wide, .flow-narrow) text[data-kind="label"] { fill: #426e63;
  font-weight: 550; }
:is(.flow-wide, .flow-narrow) rect { fill: #fbf9f5;
  stroke: #bfc8c4;
  stroke-width: 1; }
:is(.flow-wide, .flow-narrow) rect[data-tone="training"] { fill: #edf3ef;
  stroke: #79a99b; }
:is(.flow-wide, .flow-narrow) path { fill: none;
  stroke: #79a99b;
  stroke-width: 1.6; }
:is(.flow-wide, .flow-narrow) text[data-kind="sub"] { fill: #5c6874;
      font-size: 14px; }
:is(.flow-wide, .flow-narrow) text[data-kind="edge"] { fill: #26364a;
      font-size: 13px; }
:is(.flow-wide, .flow-narrow) text[data-kind="bold"] { fill: #26364a;
      font-weight: 600; }
:is(.flow-wide, .flow-narrow) rect[data-kind="mask"] { fill: #f6f1e7;
      stroke: none; }
:is(.flow-wide, .flow-narrow) rect[data-kind="group"] { fill: none;
      stroke: #bfc8c4;
      stroke-dasharray: 5 4; }
:is(.flow-wide, .flow-narrow) rect[data-kind="wait"] { fill: #fbf9f5;
      stroke: #bfc8c4;
      stroke-dasharray: 4 3; }
:is(.flow-wide, .flow-narrow) path[data-kind="dashed"] { stroke-dasharray: 5 4; }
:is(.flow-wide, .flow-narrow) path[data-kind="sync"] { stroke: #d69e5c;
      stroke-width: 2;
      stroke-dasharray: 4 3; }
:is(.flow-wide, .flow-narrow) path[data-kind="thick"] { stroke: #426e63;
      stroke-width: 3; }
:is(.flow-wide, .flow-narrow) line[data-kind="divider"] { stroke: #dddeda;
      stroke-width: 1; }
:is(.flow-wide, .flow-narrow) polygon { fill: #79a99b; }
:is(.flow-wide, .flow-narrow) polygon[data-kind="thick"] { fill: #426e63; }
</style>

    <title id="fig-segment-narrow-title">切分样本怎样改变组内平均奖励（窄屏竖向版）</title>
    <!-- Top: 同一道题 -->
    <rect x="16" y="10" width="308" height="86" rx="8" data-kind="group" />
    <text x="170" y="30" data-kind="label" text-anchor="middle">同一道题</text>
    <rect x="28" y="42" width="132" height="40" rx="6" />
    <rect x="180" y="42" width="132" height="40" rx="6" />
    <g text-anchor="middle">
      <text x="94" y="67">成功 · 1</text>
      <text x="246" y="67">失败 · 0</text>
    </g>

    <!-- Middle: 分段 -->
    <rect x="16" y="124" width="160" height="188" rx="8" data-kind="group" />
    <rect x="28" y="136" width="136" height="34" rx="6" />
    <rect x="28" y="180" width="136" height="34" rx="6" />
    <rect x="28" y="224" width="136" height="34" rx="6" />
    <g text-anchor="middle">
      <text x="96" y="159">片段 A1 · 1</text>
      <text x="96" y="203">片段 A2 · 1</text>
      <text x="96" y="247">片段 A3 · 1</text>
    </g>
    <text x="96" y="286" data-kind="edge" text-anchor="middle">继承本轨迹的优势</text>

    <rect x="186" y="124" width="138" height="100" rx="8" data-kind="group" />
    <rect x="198" y="136" width="114" height="34" rx="6" />
    <text x="255" y="159" text-anchor="middle">片段 B1 · 0</text>
    <text x="255" y="198" data-kind="edge" text-anchor="middle">继承本轨迹的优势</text>

    <!-- Arrows Top -> Middle -->
    <path d="M94 82 V130" />
    <polygon points="89,127 94,135 99,127" />
    <path d="M246 82 V130" />
    <polygon points="241,127 246,135 251,127" />

    <!-- Bottom: 两个结果框 -->
    <rect x="16" y="344" width="308" height="64" rx="8" />
    <rect x="16" y="432" width="308" height="66" rx="8" data-tone="training" />
    <g text-anchor="middle">
      <text x="170" y="370" data-kind="bold">按片段计</text>
      <text x="170" y="395">(1 + 1 + 1 + 0) / 4 = ¾</text>
      <text x="170" y="458" data-kind="bold">按任务尝试计</text>
      <text x="170" y="484">(1 + 0) / 2 = ½</text>
    </g>

    <!-- Thin lines Middle -> Upper Result -->
    <path d="M96 312 V338" />
    <polygon points="91,335 96,343 101,335" />
    <path d="M255 224 V338" />
    <polygon points="250,335 255,343 260,335" />

    <!-- Thick bypass lines Top -> Lower Result -->
    <path d="M28 62 H6 V465 H10" data-kind="thick" />
    <polygon points="7,459 15,465 7,471" data-kind="thick" />
    <path d="M312 62 H334 V465 H330" data-kind="thick" />
    <polygon points="333,459 325,465 333,471" data-kind="thick" />

    <text x="170" y="520" data-kind="sub" text-anchor="middle">两条路线只比较奖励基线</text>
  </svg>
