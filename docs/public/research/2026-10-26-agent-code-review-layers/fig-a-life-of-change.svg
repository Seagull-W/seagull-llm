<text x="32" y="14" font-size="11" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:var(--ink-2)">BEFORE THE PULL REQUEST</text>
<text x="32" y="38" font-size="14" font-weight="500" style="fill:var(--ink)">The work is verified</text>
<text x="277" y="38" font-size="13" style="fill:var(--ink-2)">Claude runs the tests, build and linter; a second agent</text>
<text x="277" y="55" font-size="13" style="fill:var(--ink-2)">reviews the diff in a fresh context</text>
<text x="32" y="95" font-size="11" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:var(--ink-2)">ON EVERY PULL REQUEST</text>
<text x="32" y="119" font-size="14" font-weight="500" style="fill:var(--ink)">Required CI</text>
<text x="277" y="119" font-size="13" style="fill:var(--ink-2)">Lint, types, tests across platforms, build and packaging. Red</text>
<text x="277" y="136" font-size="13" style="fill:var(--ink-2)">blocks the merge</text>
<text x="32" y="166" font-size="14" font-weight="500" style="fill:var(--ink)">Claude code review</text>
<text x="277" y="166" font-size="13" style="fill:var(--ink-2)">Agents hunt for bugs in parallel, verifiers vote on each</text>
<text x="277" y="183" font-size="13" style="fill:var(--ink-2)">finding, survivors ranked by severity</text>
<text x="32" y="213" font-size="14" font-weight="500" style="fill:var(--ink)">Security review</text>
<text x="277" y="213" font-size="13" style="fill:var(--ink-2)">A separate pass. Open findings from either review block the</text>
<text x="277" y="230" font-size="13" style="fill:var(--ink-2)">merge</text>
<text x="32" y="260" font-size="14" font-weight="500" style="fill:var(--ink)">Risk-based approval</text>
<text x="277" y="260" font-size="13" style="fill:var(--ink-2)">A classifier sets the tier: no person, one, or two. Some paths</text>
<text x="277" y="277" font-size="13" style="fill:var(--ink-2)">always need a person</text>
<text x="32" y="317" font-size="11" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:var(--ink-2)">MERGING</text>
<text x="32" y="341" font-size="14" font-weight="500" style="fill:var(--ink)">Merge queue</text>
<text x="277" y="341" font-size="13" style="fill:var(--ink-2)">Checks run again on the latest main with the change applied</text>
<text x="32" y="381" font-size="11" font-weight="500" letter-spacing="0.08em" class="mono" style="fill:var(--ink-2)">AFTER THE MERGE</text>
<text x="32" y="405" font-size="14" font-weight="500" style="fill:var(--ink)">Behind a flag, used internally first</text>
<text x="277" y="405" font-size="13" style="fill:var(--ink-2)">Anthropic employees run it before it reaches everyone</text>
<text x="32" y="435" font-size="14" font-weight="500" style="fill:var(--ink)">Gradual release</text>
<text x="277" y="435" font-size="13" style="fill:var(--ink-2)">The latest channel first; the stable channel trails it</text>
<text x="32" y="465" font-size="14" font-weight="500" style="fill:var(--ink)">Watch, fix forward or roll back</text>
<text x="277" y="465" font-size="13" style="fill:var(--ink-2)">The author and on-call watch; flags turn off quickly, broken</text>
<text x="277" y="482" font-size="13" style="fill:var(--ink-2)">builds get reverted</text>
<circle cx="11" cy="511.5" r="7" stroke-width="2" style="fill:var(--bg);stroke:var(--bg)"/>
<circle cx="11" cy="511.5" r="6.5" fill="none" stroke-width="1" style="stroke:var(--viz-muted)"/>
<path d="M8 511.5 L10.2 513.8 L14.2 509.3" fill="none" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--viz-m1)"/>
<text x="26" y="516" font-size="13" style="fill:var(--ink-2)">automated</text>
<circle cx="122.66593017578126" cy="511.5" r="7" stroke-width="2" style="fill:var(--bg);stroke:var(--bg)"/>
<polygon points="122.66593017578126,504.5 129.66593017578126,511.5 122.66593017578126,518.5 115.66593017578126,511.5" style="fill:var(--fig-focal)"/>
<text x="137.66593017578126" y="516" font-size="13" style="fill:var(--ink-2)">a person decides, scaled by risk</text>
