<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="一组八条答案里三条靠漏洞通过：把作弊改判为普通失败会让全组优势归零，反向惩罚才把鼓励翻成抑制"><style>text{font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;} .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6b60"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8452c"/></marker></defs><rect width="920" height="470" fill="#fbfaf6"/><text x="16" y="38" font-size="16.2" fill="#1b1a17" text-anchor="start" font-weight="600">一组 8 条答案，弱测试只放过 3 条</text><text x="16" y="58" font-size="13.5" fill="#a8452c" text-anchor="start" font-weight="400">审计发现：这 3 条通过全部来自漏洞</text><rect x="16" y="74" width="34" height="34" rx="4" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="33.0" y="126" font-size="11.88" fill="#6f6b60" text-anchor="middle" font-weight="400">失败</text><rect x="62" y="74" width="34" height="34" rx="4" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="79.0" y="126" font-size="11.88" fill="#a8452c" text-anchor="middle" font-weight="400">作弊</text><rect x="108" y="74" width="34" height="34" rx="4" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="125.0" y="126" font-size="11.88" fill="#6f6b60" text-anchor="middle" font-weight="400">失败</text><rect x="154" y="74" width="34" height="34" rx="4" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="171.0" y="126" font-size="11.88" fill="#6f6b60" text-anchor="middle" font-weight="400">失败</text><rect x="200" y="74" width="34" height="34" rx="4" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="217.0" y="126" font-size="11.88" fill="#a8452c" text-anchor="middle" font-weight="400">作弊</text><rect x="246" y="74" width="34" height="34" rx="4" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="263.0" y="126" font-size="11.88" fill="#6f6b60" text-anchor="middle" font-weight="400">失败</text><rect x="292" y="74" width="34" height="34" rx="4" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="309.0" y="126" font-size="11.88" fill="#a8452c" text-anchor="middle" font-weight="400">作弊</text><rect x="338" y="74" width="34" height="34" rx="4" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="355.0" y="126" font-size="11.88" fill="#6f6b60" text-anchor="middle" font-weight="400">失败</text><text x="16" y="162" font-size="13.5" fill="#48453f" text-anchor="start" font-weight="400">通过者少，候选就少，强验证器查在这里每条信息量最大。</text><text x="16" y="180" font-size="13.5" fill="#48453f" text-anchor="start" font-weight="400">同样的预算随机摊到整组，后期作弊率仍有 36.33%–51.68%。</text><rect x="56" y="206" width="14" height="12" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="76" y="216" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">通过弱测试的作弊答案</text><rect x="216" y="206" width="14" height="12" rx="2" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="236" y="216" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">弱测试失败</text><text x="470" y="38" font-size="16.2" fill="#1b1a17" text-anchor="start" font-weight="600">同一组答案，三种奖励写法</text><text x="470" y="58" font-size="12.42" fill="#6f6b60" text-anchor="start" font-weight="400">纵轴＝该答案在本组内的优势（示意方向）</text><text x="470" y="88" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">只看弱测试：通过就 +1</text><line x1="462" y1="146" x2="600" y2="146" stroke="#48453f" stroke-width="1"/><rect x="470" y="146" width="12" height="24.0" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="487" y="106" width="12" height="40" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="504" y="146" width="12" height="24.0" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="521" y="146" width="12" height="24.0" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="538" y="106" width="12" height="40" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="555" y="146" width="12" height="24.0" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="572" y="106" width="12" height="40" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="589" y="146" width="12" height="24.0" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><text x="614" y="142" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">作弊答案照样拿到很强的正优势</text><text x="470" y="202" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">改判为普通失败：奖励与失败相同</text><line x1="462" y1="260" x2="600" y2="260" stroke="#48453f" stroke-width="1"/><rect x="470" y="260" width="12" height="1.4" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="487" y="260" width="12" height="1.4" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="504" y="260" width="12" height="1.4" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="521" y="260" width="12" height="1.4" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="538" y="260" width="12" height="1.4" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="555" y="260" width="12" height="1.4" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="572" y="260" width="12" height="1.4" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="589" y="260" width="12" height="1.4" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><text x="614" y="256" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">全组奖励相同，优势全为 0，这组不再教任何东西</text><text x="470" y="316" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">反向惩罚：压到失败线以下</text><line x1="462" y1="374" x2="600" y2="374" stroke="#48453f" stroke-width="1"/><rect x="470" y="369.2" width="12" height="4.8" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="487" y="374" width="12" height="40" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="504" y="369.2" width="12" height="4.8" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="521" y="369.2" width="12" height="4.8" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="538" y="374" width="12" height="40" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="555" y="369.2" width="12" height="4.8" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><rect x="572" y="374" width="12" height="40" rx="2" fill="#f5e4de" stroke="#a8452c" stroke-width="0.8"/><rect x="589" y="369.2" width="12" height="4.8" rx="2" fill="#ece8dd" stroke="#d9d3c4" stroke-width="0.8"/><text x="614" y="370" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">作弊得负优势，其余失败反而微正</text><line x1="16" y1="440" x2="904" y2="440" stroke="#d9d3c4" stroke-width="1"/><text x="16" y="458" font-size="12.42" fill="#6f6b60" text-anchor="start" font-weight="400">第三行里失败者微正，是因为本组均值为负；三种写法的差别不在分数尺度，而在作弊答案拿到正号还是负号。</text></svg>