<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 392" width="920" height="392" role="img" aria-label="VeriCUA：执行者到终点后，可训练的 Judge 列出成功条件，证据不足就把未解决项交给冻结的 Probe 进环境取证，再回到 Judge；每个终态只有一次验证尝试"><style>text{font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;} .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6b60"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8452c"/></marker></defs><rect width="920" height="392" fill="#fbfaf6"/><rect x="16" y="58" width="196" height="108" rx="8" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="30" y="82" font-size="14.58" fill="#1b1a17" text-anchor="start" font-weight="600">执行者</text><text x="30" y="104" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">GUI 任务走到终点</text><text x="30" y="122" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">操作历史 ＋ 最近截图</text><text x="30" y="140" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">＋ 执行后的真实环境</text><rect x="252" y="40" width="300" height="180" rx="8" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="266" y="64" font-size="14.58" fill="#a8452c" text-anchor="start" font-weight="600">Judge（可训练）</text><text x="266" y="86" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">① 拆出这一步要满足的条件</text><text x="266" y="104" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">② 逐条标：满足／违反／未解决</text><text x="266" y="122" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">③ 决定还缺哪一条证据</text><text x="266" y="140" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">④ 证据够就判决，不够转 Probe</text><rect x="620" y="24" width="284" height="96" rx="8" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="634" y="48" font-size="14.58" fill="#1b1a17" text-anchor="start" font-weight="600">判决：成功 或 失败</text><text x="634" y="70" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">证据齐了就不再探查</text><text x="634" y="88" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">判决对错决定一部分奖励</text><rect x="620" y="140" width="284" height="100" rx="8" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="634" y="164" font-size="14.58" fill="#1b1a17" text-anchor="start" font-weight="600">奖励</text><text x="634" y="186" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">判决是否正确</text><text x="634" y="204" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">该查的时候有没有查</text><text x="634" y="222" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">证据不足就判成功 → 罚</text><rect x="620" y="268" width="284" height="96" rx="8" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="634" y="292" font-size="14.58" fill="#1b1a17" text-anchor="start" font-weight="600">Probe（冻结）</text><text x="634" y="314" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">按未解决项进入界面检查</text><text x="634" y="332" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">截图、控件状态、可执行判断</text><text x="634" y="350" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">只取证，不替执行者补做任务</text><rect x="16" y="246" width="380" height="120" rx="8" fill="#ffffff" stroke="#d9d3c4" stroke-width="1" stroke-dasharray="5 4"/><text x="30" y="270" font-size="14.58" fill="#1b1a17" text-anchor="start" font-weight="600">一次尝试</text><text x="30" y="292" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">判早了没有第二次机会。</text><text x="30" y="310" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">奖励既要看判得对不对，</text><text x="30" y="328" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">也要看该查的时候查了没有。</text><line x1="212" y1="112" x2="248" y2="112" stroke="#d9d3c4" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M552 90 H616" fill="none" stroke="#d9d3c4" stroke-width="1.2" marker-end="url(#arrow)"/><text x="556" y="82" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">够</text><path d="M552 170 H590 V316 H616" fill="none" stroke="#d9d3c4" stroke-width="1.2" marker-end="url(#arrow)"/><text x="556" y="162" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">不够</text><path d="M762 120 V136" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4 3"/><text x="770" y="133" font-size="10.8" fill="#6f6b60" text-anchor="start" font-weight="400">判决结果</text><path d="M712 268 V244" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4 3"/><text x="720" y="262" font-size="10.8" fill="#6f6b60" text-anchor="start" font-weight="400">是否探查</text><path d="M616 340 H420 V224" fill="none" stroke="#a8452c" stroke-width="1.2" marker-end="url(#arrow)"/><text x="432" y="356" font-size="11.88" fill="#a8452c" text-anchor="start" font-weight="400">新证据回到同一轮判断</text><line x1="16" y1="380" x2="904" y2="380" stroke="#d9d3c4" stroke-width="1"/><text x="16" y="390" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">虚线是奖励的输入：判决结果与是否探查分别进入奖励，两条都不参与流程推进。</text></svg>