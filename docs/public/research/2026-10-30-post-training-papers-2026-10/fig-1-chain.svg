<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 306" width="920" height="306" role="img" aria-label="后训练的一条链：采样、验证、更新、评测，以及本文纳入的十二篇论文各自站在哪一环"><style>text{font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;} .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6b60"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8452c"/></marker></defs><rect width="920" height="306" fill="#fbfaf6"/><rect x="16" y="22" width="204" height="250" rx="8" fill="#f2eee3" stroke="#d9d3c4" stroke-width="1"/><text x="30" y="50" font-size="18.36" fill="#1b1a17" text-anchor="start" font-weight="600">采样</text><text x="30" y="74" font-size="12.96" fill="#6f6b60" text-anchor="start" font-weight="400">多采一条，还是把已有轨迹用尽？</text><rect x="28" y="122" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="38" y="137" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">CERO</text><text x="38" y="150" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">选哪些题、每轮几组</text><rect x="28" y="162" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="38" y="177" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">Double-Rollout</text><text x="38" y="190" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">同一前缀续写多次</text><rect x="28" y="202" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="38" y="217" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">TreeOPSD</text><text x="38" y="230" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">多轮交互采样成树</text><line x1="223" y1="147" x2="239" y2="147" stroke="#6f6b60" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="244" y="22" width="204" height="250" rx="8" fill="#f2eee3" stroke="#d9d3c4" stroke-width="1"/><text x="258" y="50" font-size="18.36" fill="#1b1a17" text-anchor="start" font-weight="600">验证</text><text x="258" y="74" font-size="12.96" fill="#6f6b60" text-anchor="start" font-weight="400">可靠的标签从哪来，预算花在谁</text><text x="258" y="92" font-size="12.96" fill="#6f6b60" text-anchor="start" font-weight="400">的检查上</text><rect x="256" y="122" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="266" y="137" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">Audit</text><text x="266" y="150" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">强验证器查哪些组</text><rect x="256" y="162" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="266" y="177" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">VeriCUA</text><text x="266" y="190" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">判不了就去环境取证</text><rect x="256" y="202" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="266" y="217" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">临床概念重叠</text><text x="266" y="230" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">把部分匹配当奖励</text><line x1="451" y1="147" x2="467" y2="147" stroke="#6f6b60" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="472" y="22" width="204" height="250" rx="8" fill="#f2eee3" stroke="#d9d3c4" stroke-width="1"/><text x="486" y="50" font-size="18.36" fill="#1b1a17" text-anchor="start" font-weight="600">更新</text><text x="486" y="74" font-size="12.96" fill="#6f6b60" text-anchor="start" font-weight="400">蒸馏和奖励怎么交接，按什么粒</text><text x="486" y="92" font-size="12.96" fill="#6f6b60" text-anchor="start" font-weight="400">度分流</text><rect x="484" y="122" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="494" y="137" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">Sequential</text><text x="494" y="150" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">先蒸馏，后撤教师</text><rect x="484" y="162" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="494" y="177" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">教师/学生预热</text><text x="494" y="190" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">先改谁再蒸馏</text><rect x="484" y="202" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="494" y="217" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">Self-Routing</text><text x="494" y="230" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">逐样本选配方</text><rect x="484" y="242" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="494" y="257" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">OPW</text><text x="494" y="270" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">在学生走到的状态上监督</text><line x1="679" y1="147" x2="695" y2="147" stroke="#6f6b60" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="700" y="22" width="204" height="250" rx="8" fill="#f2eee3" stroke="#d9d3c4" stroke-width="1"/><text x="714" y="50" font-size="18.36" fill="#1b1a17" text-anchor="start" font-weight="600">评测</text><text x="714" y="74" font-size="12.96" fill="#6f6b60" text-anchor="start" font-weight="400">涨分究竟证明了哪一种能力</text><rect x="712" y="122" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="722" y="137" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">pass@k 盲点</text><text x="722" y="150" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">只看能否答对一次</text><rect x="712" y="162" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="722" y="177" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">Sharpening Tax</text><text x="722" y="190" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">重试覆盖在缩水</text><rect x="712" y="202" width="180" height="34" rx="6" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="722" y="217" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">共同要求</text><text x="722" y="230" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">都保留起始检查点</text><line x1="16" y1="286" x2="904" y2="286" stroke="#d9d3c4" stroke-width="1"/><text x="16" y="300" font-size="13.5" fill="#48453f" text-anchor="start" font-weight="400">同一份涨分可能来自任何一环；只报分数时分不出改的是哪一环。</text></svg>