<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" width="920" height="436" role="img" aria-label="共享前缀的两种用法：Double-Rollout 从同一前缀续写多次以重估整条轨迹的奖励；TreeOPSD 把终局奖励沿交互树汇总成每一轮的信用"><style>text{font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;} .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6b60"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8452c"/></marker></defs><rect width="920" height="436" fill="#fbfaf6"/><text x="16" y="34" font-size="15.66" fill="#1b1a17" text-anchor="start" font-weight="600">Double-Rollout：给整段推理换一个奖励</text><rect x="16" y="56" width="300" height="26" rx="4" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="28" y="74" font-size="12.42" fill="#a8452c" text-anchor="start" font-weight="400">保留 90% 思考前缀</text><rect x="316" y="56" width="64" height="26" rx="4" fill="#ffffff" stroke="#a8452c" stroke-width="1" stroke-dasharray="4 3"/><text x="348" y="74" font-size="11.34" fill="#a8452c" text-anchor="middle" font-weight="400">原答案</text><path d="M316 82 C340 89.2 340 107 366 107" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="100" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="111" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">✗</text><path d="M316 82 C340 97.2 340 127 366 127" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="120" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="131" font-size="11.88" fill="#35625b" text-anchor="start" font-weight="400">✓</text><path d="M316 82 C340 105.2 340 147 366 147" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="140" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="151" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">✗</text><path d="M316 82 C340 113.2 340 167 366 167" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="160" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="171" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">✗</text><path d="M316 82 C340 121.2 340 187 366 187" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="180" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="191" font-size="11.88" fill="#35625b" text-anchor="start" font-weight="400">✓</text><path d="M316 82 C340 129.2 340 207 366 207" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="200" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="211" font-size="11.88" fill="#35625b" text-anchor="start" font-weight="400">✓</text><path d="M316 82 C340 137.2 340 227 366 227" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="220" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="231" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">✗</text><path d="M316 82 C340 145.2 340 247 366 247" fill="none" stroke="#d9d3c4" stroke-width="1" marker-end="url(#arrow)"/><rect x="370" y="240" width="100" height="14" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.7"/><text x="482" y="251" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">✗</text><text x="16" y="286" font-size="12.96" fill="#1b1a17" text-anchor="start" font-weight="600">奖励＝这 8 次续写的平均正确率</text><text x="16" y="308" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">原答案错、重估为正：用一条正确续写替换训练轨迹；原答案对但重估低，则不修好，</text><text x="16" y="326" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">保留对猜测的惩罚。</text><text x="16" y="368" font-size="11.88" fill="#a8452c" text-anchor="start" font-weight="400">成本：rollout 大约翻倍（90% 前缀 ＋ 8 次短续写）</text><text x="16" y="386" font-size="11.88" fill="#6f6b60" text-anchor="start" font-weight="400">验证器没换：系统性误判不会因为多采几次就消失</text><line x1="470" y1="20" x2="470" y2="402" stroke="#d9d3c4" stroke-width="1"/><text x="500" y="34" font-size="15.66" fill="#1b1a17" text-anchor="start" font-weight="600">TreeOPSD：把终局奖励摊到每一轮</text><rect x="644" y="46" width="88" height="32" rx="6" fill="#f2eee3" stroke="#d9d3c4" stroke-width="1"/><text x="688" y="67" font-size="11.88" fill="#1b1a17" text-anchor="middle" font-weight="400">同一历史</text><path d="M688 78 V124 H556 V138" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="556" cy="148" r="6" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><path d="M556 154 V212 H520 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="520" cy="226" r="5" fill="#35625b" stroke="#35625b" stroke-width="1"/><path d="M556 154 V212 H568 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="568" cy="226" r="5" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><path d="M688 78 V124 H644 V138" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="644" cy="148" r="6" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><path d="M644 154 V212 H616 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="616" cy="226" r="5" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><path d="M644 154 V212 H664 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="664" cy="226" r="5" fill="#35625b" stroke="#35625b" stroke-width="1"/><path d="M688 78 V124 H732 V138" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="732" cy="148" r="6" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><path d="M732 154 V212 H712 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="712" cy="226" r="5" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><path d="M732 154 V212 H760 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="760" cy="226" r="5" fill="#35625b" stroke="#35625b" stroke-width="1"/><path d="M688 78 V124 H820 V138" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="820" cy="148" r="6" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><path d="M820 154 V212 H808 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="808" cy="226" r="5" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><path d="M820 154 V212 H856 V219" fill="none" stroke="#d9d3c4" stroke-width="1"/><circle cx="856" cy="226" r="5" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><circle cx="504" cy="248" r="4.5" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="516" y="252" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">每轮动作</text><circle cx="596" cy="248" r="4.5" fill="#35625b" stroke="#35625b" stroke-width="1"/><text x="608" y="252" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">终局对</text><circle cx="676" cy="248" r="4.5" fill="#ffffff" stroke="#d9d3c4" stroke-width="1"/><text x="688" y="252" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">终局错</text><line x1="500" y1="266" x2="890" y2="266" stroke="#d9d3c4" stroke-width="1"/><text x="500" y="290" font-size="12.96" fill="#48453f" text-anchor="start" font-weight="400">终局奖励沿树汇总成每一轮的信用，再转成“这一轮该增强或削弱多少”的</text><text x="500" y="310" font-size="12.96" fill="#48453f" text-anchor="start" font-weight="400">固定目标。</text><text x="500" y="342" font-size="12.42" fill="#6f6b60" text-anchor="start" font-weight="400">目标固定、偏移重算：达到就减弱更新，越过可反向纠正。共享前缀只算一</text><text x="500" y="360" font-size="12.42" fill="#6f6b60" text-anchor="start" font-weight="400">次，同一动作不会随叶子重复训练。</text></svg>