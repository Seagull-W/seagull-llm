<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="评测的三种口径：pass@k 只看能否答对一次，重复成功看是否次次成功，解法多样性看成功来自几种输出；后训练会把任务推向全对与全错两端"><style>text{font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;} .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6b60"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8452c"/></marker></defs><rect width="920" height="440" fill="#fbfaf6"/><text x="16" y="34" font-size="15.66" fill="#1b1a17" text-anchor="start" font-weight="600">① 同一批采样，三个不同的问题</text><text x="16" y="86" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">pass@k</text><text x="16" y="102" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">多次尝试里至少有一条对</text><rect x="214" y="74" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="224" y="89" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="240" y="74" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="266" y="74" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="292" y="74" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="302" y="89" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="318" y="74" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="344" y="74" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="370" y="74" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="396" y="74" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="406" y="89" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><text x="16" y="148" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">重复成功</text><text x="16" y="164" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">每一次尝试都对</text><rect x="214" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="224" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="240" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="250" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="266" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="276" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="292" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="302" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="318" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="328" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="344" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="354" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="370" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="380" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="396" y="136" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="406" y="151" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><text x="16" y="210" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">解法多样性</text><text x="16" y="226" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">对的那几条是不是同一个答案</text><rect x="214" y="198" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="224" y="213" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><rect x="240" y="198" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="266" y="198" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="292" y="198" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="302" y="213" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">B</text><rect x="318" y="198" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="344" y="198" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="370" y="198" width="20" height="20" rx="3" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><rect x="396" y="198" width="20" height="20" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="406" y="213" font-size="10.26" fill="#35625b" text-anchor="middle" font-weight="400">A</text><text x="214" y="246" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">八条采样：绿＝正确，字母＝不同解法</text><text x="16" y="284" font-size="12.96" fill="#48453f" text-anchor="start" font-weight="400">GSM8K 留出 100 题、每题 32 条：pass@k 接近时，</text><text x="16" y="302" font-size="12.96" fill="#48453f" text-anchor="start" font-weight="400">GRPO 的 distinct-3 为 0.436，RFT 两组为 0.512／0.509；</text><text x="16" y="320" font-size="12.96" fill="#48453f" text-anchor="start" font-weight="400">统一到 157 词长度后仍差约 14%。</text><text x="16" y="348" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">Qwen2.5-1.5B-Instruct；RFT 只拟合自己生成的最短正确答案</text><line x1="452" y1="20" x2="452" y2="420" stroke="#d9d3c4" stroke-width="1"/><text x="486" y="34" font-size="15.66" fill="#1b1a17" text-anchor="start" font-weight="600">② 后训练把任务推向两端</text><text x="486" y="54" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">每题反复采样：横轴是重试成功率，纵轴是题目数（示意）</text><line x1="520" y1="208" x2="850" y2="208" stroke="#d9d3c4" stroke-width="1"/><line x1="520" y1="208" x2="520" y2="78" stroke="#d9d3c4" stroke-width="1"/><text x="850" y="226" font-size="10.8" fill="#6f6b60" text-anchor="end" font-weight="400">重试成功率 1</text><text x="514" y="226" font-size="10.8" fill="#6f6b60" text-anchor="end" font-weight="400">0</text><text x="520" y="72" font-size="10.8" fill="#6f6b60" text-anchor="start" font-weight="400">题目数</text><path d="M546 198 C600 112 670 86 710 146 C738 186 770 198 796 198" fill="none" stroke="#6f6b60" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M530 104 C552 192 590 198 670 196 C756 194 816 174 842 98" fill="none" stroke="#a8452c" stroke-width="2"/><text x="524" y="96" font-size="11.34" fill="#a8452c" text-anchor="start" font-weight="400">后训练后</text><text x="692" y="104" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">后训练前</text><text x="486" y="256" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">Sharpening Tax ＝ 相对起始模型少掉的那部分重试收益</text><text x="486" y="276" font-size="12.42" fill="#48453f" text-anchor="start" font-weight="400">Sokoban／Qwen2.5-7B-Instruct／PPO 200 步，加 PTGS 后：</text><text x="486" y="300" font-size="12.96" fill="#35625b" text-anchor="start" font-weight="400" class="mono">pass@1    46.5 → 61.1</text><text x="486" y="320" font-size="12.96" fill="#35625b" text-anchor="start" font-weight="400" class="mono">pass@128  55.0 → 69.7</text><text x="486" y="340" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">五次运行均值；调的是采样温度，不是 RL 更新</text></svg>