<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 396" width="920" height="396" role="img" aria-label="同一个信号的两种时间安排：同一步同时施加 OPD 与 GRPO，或先用 OPD、第 60 步撤掉教师转 GRPO；Self-Routing 把选择细化到每道题"><style>text{font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Source Han Sans SC',system-ui,sans-serif;} .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f6b60"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a8452c"/></marker></defs><rect width="920" height="396" fill="#fbfaf6"/><text x="16" y="34" font-size="16.2" fill="#1b1a17" text-anchor="start" font-weight="600">① 顺序还是同时：同一步数的两种排法</text><text x="16" y="76" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">同时施加</text><text x="16" y="94" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">两个损失叠在一步更新里</text><rect x="170" y="58" width="690" height="16" rx="3" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="180" y="70" font-size="11.34" fill="#a8452c" text-anchor="start" font-weight="400">教师分布的 OPD 损失</text><rect x="170" y="79" width="690" height="16" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="1"/><text x="180" y="91" font-size="11.34" fill="#35625b" text-anchor="start" font-weight="400">答案验证的 GRPO 奖励</text><text x="16" y="138" font-size="13.5" fill="#1b1a17" text-anchor="start" font-weight="600">先蒸馏后 RL</text><text x="16" y="156" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">第 60 步撤掉教师</text><rect x="170" y="122" width="414.0" height="32" rx="3" fill="#f5e4de" stroke="#a8452c" stroke-width="1"/><text x="180" y="142" font-size="11.88" fill="#a8452c" text-anchor="start" font-weight="400">OPD（教师在场）</text><rect x="584.0" y="122" width="276.0" height="32" rx="3" fill="#e4ede9" stroke="#35625b" stroke-width="1"/><text x="594.0" y="142" font-size="11.88" fill="#35625b" text-anchor="start" font-weight="400">GRPO（教师撤走）</text><line x1="584.0" y1="116" x2="584.0" y2="162" stroke="#48453f" stroke-width="1" stroke-dasharray="3 3"/><line x1="170" y1="178" x2="860" y2="178" stroke="#d9d3c4" stroke-width="1"/><line x1="170" y1="178" x2="170" y2="184" stroke="#d9d3c4" stroke-width="1"/><text x="170" y="198" font-size="11.34" fill="#6f6b60" text-anchor="middle" font-weight="400">第 0 步</text><line x1="584.0" y1="178" x2="584.0" y2="184" stroke="#d9d3c4" stroke-width="1"/><text x="584.0" y="198" font-size="11.34" fill="#6f6b60" text-anchor="middle" font-weight="400">第 60 步</text><line x1="860" y1="178" x2="860" y2="184" stroke="#d9d3c4" stroke-width="1"/><text x="860" y="198" font-size="11.34" fill="#6f6b60" text-anchor="middle" font-weight="400">第 100 步</text><line x1="16" y1="216" x2="904" y2="216" stroke="#d9d3c4" stroke-width="1"/><text x="16" y="244" font-size="16.2" fill="#1b1a17" text-anchor="start" font-weight="600">② 每道题各选配方：Self-Routing 的四条队列</text><rect x="16" y="262" width="160" height="84" rx="8" fill="#f2eee3" stroke="#d9d3c4" stroke-width="1"/><text x="28" y="286" font-size="12.42" fill="#1b1a17" text-anchor="start" font-weight="600">每道题当前的一组回答</text><text x="28" y="304" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">这一组的对错</text><text x="28" y="320" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">token 熵给出的置信</text><text x="28" y="336" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="400">历史上是否反复解出</text><path d="M178 314 H236" fill="none" stroke="#d9d3c4" stroke-width="1.2" marker-end="url(#arrow)"/><text x="178" y="302" font-size="10.8" fill="#6f6b60" text-anchor="start" font-weight="400">平滑成分数</text><rect x="244" y="264" width="660" height="18" rx="4" fill="#e4ede9" stroke="#35625b" stroke-width="0.9"/><text x="256" y="277" font-size="11.34" fill="#35625b" text-anchor="start" font-weight="600">GRPO</text><text x="330" y="277" font-size="11.34" fill="#48453f" text-anchor="start" font-weight="400">有对有错：按组内相对奖励更新</text><rect x="244" y="285" width="660" height="18" rx="4" fill="#f5e4de" stroke="#a8452c" stroke-width="0.9"/><text x="256" y="298" font-size="11.34" fill="#a8452c" text-anchor="start" font-weight="600">自蒸馏</text><text x="330" y="298" font-size="11.34" fill="#48453f" text-anchor="start" font-weight="400">全错且低置信：参考答案下给监督</text><rect x="244" y="306" width="660" height="18" rx="4" fill="#ece8dd" stroke="#48453f" stroke-width="0.9"/><text x="256" y="319" font-size="11.34" fill="#48453f" text-anchor="start" font-weight="600">保守正则</text><text x="330" y="319" font-size="11.34" fill="#48453f" text-anchor="start" font-weight="400">已稳定解出：只做小幅更新</text><rect x="244" y="327" width="660" height="18" rx="4" fill="#ffffff" stroke="#d9d3c4" stroke-width="0.9"/><text x="256" y="340" font-size="11.34" fill="#6f6b60" text-anchor="start" font-weight="600">暂时跳过</text><text x="330" y="340" font-size="11.34" fill="#48453f" text-anchor="start" font-weight="400">高置信失败：这一轮不学</text><line x1="16" y1="372" x2="904" y2="372" stroke="#d9d3c4" stroke-width="1"/><text x="16" y="388" font-size="12.42" fill="#6f6b60" text-anchor="start" font-weight="400">按分数采样而非硬阈值，避免组里一条答案翻转就让整道题换配方。两段时间轴共用步数轴，等步数不等于等算力。</text></svg>