<svg xmlns="http://www.w3.org/2000/svg" width="920" viewBox="0 0 920 680" role="img" aria-labelledby="title desc">
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#203349;font-size:14px}.h{font-size:22px;font-weight:700}.small{font-size:12px}.axis{font-size:15px;font-weight:600}.label{font-size:15px;font-weight:600}</style>
<rect width="920" height="680" rx="16" fill="#f6f8fc"/>
<title id="title">同步、设备分离和完全异步的时间线</title><desc id="desc">三类调度的示意时间线，显示共置交替、分离同步的整组等待和异步的策略陈旧。长度只作示意，不表示实测比例。</desc>
<text x="30" y="40" class="h">消除等待之后，策略版本问题留在轨迹里</text>
<text x="30" y="67">时间从左向右；矩形宽度仅示意。橙色为权重交接，不含在绿色更新块中。</text>
<path d="M170 100H882" stroke="#63758c" stroke-width="2"/><path d="M882 100l-10 -5v10z" fill="#63758c"/><text x="839" y="89">时间</text>
<text x="30" y="139" class="axis">共置同步</text><text x="30" y="169" class="">同组 GPU</text><rect x="170" y="147" width="235" height="32" rx="5" fill="#c7dcf6"/><text x="178" y="168" class="">生成：短样本结束，长样本继续</text><rect x="410" y="147" width="155" height="32" rx="5" fill="#bfe4d4"/><text x="418" y="168" class="">更新权重 v1</text><rect x="570" y="147" width="80" height="32" rx="5" fill="#f5d5a7"/><text x="578" y="168" class="">权重交接</text><rect x="655" y="147" width="222" height="32" rx="5" fill="#c7dcf6"/><text x="663" y="168" class="">下一批生成 v1</text><text x="174" y="204" class="">长尾时有效批量缩小；更新时生成暂停。</text><text x="30" y="258" class="axis">分离但同步</text><text x="30" y="293" class="">推理 GPU</text><text x="30" y="335" class="">训练 GPU</text><rect x="170" y="272" width="235" height="32" rx="5" fill="#c7dcf6"/><text x="178" y="293" class="">生成 v0</text><rect x="410" y="272" width="155" height="32" rx="5" fill="#e1e5eb"/><text x="418" y="293" class="">等待更新</text><rect x="570" y="272" width="80" height="32" rx="5" fill="#f5d5a7"/><text x="578" y="293" class="">权重交接</text><rect x="655" y="272" width="222" height="32" rx="5" fill="#c7dcf6"/><text x="663" y="293" class="">生成 v1</text><rect x="170" y="314" width="235" height="32" rx="5" fill="#e1e5eb"/><text x="178" y="335" class="">等待完整批次</text><rect x="410" y="314" width="155" height="32" rx="5" fill="#bfe4d4"/><text x="418" y="335" class="">更新到 v1</text><rect x="570" y="314" width="307" height="32" rx="5" fill="#e1e5eb"/><text x="578" y="335" class="">等待下一批</text><text x="174" y="370" class="">两组设备已经分开，全局屏障仍让一组 GPU 整段空转。</text><text x="30" y="422" class="axis">完全异步</text><text x="30" y="457" class="">推理 GPU</text><text x="30" y="499" class="">训练 GPU</text><rect x="170" y="436" width="185" height="32" rx="5" fill="#c7dcf6"/><text x="178" y="457" class="">生成 v0</text><rect x="360" y="436" width="200" height="32" rx="5" fill="#c7dcf6"/><text x="368" y="457" class="">长轨迹继续 v0</text><rect x="565" y="436" width="60" height="32" rx="5" fill="#f5d5a7"/><text x="573" y="457" class="">权重交接</text><rect x="630" y="436" width="247" height="32" rx="5" fill="#c7dcf6"/><text x="638" y="457" class="">续生成 v1／新请求 v1</text><rect x="170" y="478" width="185" height="32" rx="5" fill="#e1e5eb"/><text x="178" y="499" class="">等待首批</text><rect x="360" y="478" width="200" height="32" rx="5" fill="#bfe4d4"/><text x="368" y="499" class="">用已完成样本更新 v1</text><rect x="565" y="478" width="60" height="32" rx="5" fill="#e1e5eb"/><text x="573" y="499" class="">等待</text><rect x="630" y="478" width="247" height="32" rx="5" fill="#bfe4d4"/><text x="638" y="499" class="">消费较旧样本，更新 v2</text><path d="M450 468V473H730V478" fill="none" stroke="#b35d22" stroke-width="2"/><text x="174" y="535">陈旧度：采样版本落后于消费时的训练版本；一条长轨迹还可能混合版本。</text>
<text x="174" y="559">换权重后的 KV 处理：AReaL 重算；PipelineRL 保留并承受近似误差。</text>
<rect x="30" y="590" width="145" height="32" rx="5" fill="#c7dcf6"/><text x="38" y="611" class="">生成</text><rect x="195" y="590" width="145" height="32" rx="5" fill="#e1e5eb"/><text x="203" y="611" class="">等待 / 空转</text><rect x="360" y="590" width="145" height="32" rx="5" fill="#bfe4d4"/><text x="368" y="611" class="">训练更新</text><rect x="525" y="590" width="145" height="32" rx="5" fill="#f5d5a7"/><text x="533" y="611" class="">权重交接</text><text x="30" y="652" class="small">本文自绘 · 省略奖励与概率重算阶段；异步仍可能受补给不足、陈旧度上限和换权重屏障限制。</text></svg>