<svg xmlns="http://www.w3.org/2000/svg" class="flow-wide flow-wide" viewBox="0 0 920 335" role="img" aria-labelledby="fig-tau-title-wide">
<style>
  text { font-family: "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
  svg { font-size: 20px; }
  :is(.flow-wide, .flow-narrow) text { fill: #26364a;
  font: 400 20px "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
:is(.flow-wide, .flow-narrow) text[data-kind="label"] { fill: #426e63;
  font-weight: 550; }
:is(.flow-wide, .flow-narrow) rect { fill: #fbf9f5;
  stroke: #bfc8c4;
  stroke-width: 1; }
:is(.flow-wide, .flow-narrow) rect[data-tone="training"] { fill: #edf3ef;
  stroke: #79a99b; }
:is(.flow-wide, .flow-narrow) path { fill: none;
  stroke: #79a99b;
  stroke-width: 1.6; }
.flow-wide text { font-size: 16px; }
:is(.flow-wide, .flow-narrow) text[data-kind="small"] { font-size: 14px; }
:is(.flow-wide, .flow-narrow) text[data-kind="caution"] { fill: #9a6018;
      font-size: 14px;
      font-weight: 550; }
:is(.flow-wide, .flow-narrow) rect[data-kind="mask"] { fill: #f6f1e7;
      stroke: none; }
:is(.flow-wide, .flow-narrow) rect[data-tone="caution"] { fill: #fdf6ec;
      stroke: #c98a3b;
      stroke-width: 1.6;
      stroke-dasharray: 6 4; }
:is(.flow-wide, .flow-narrow) rect[data-tone="score"],
    :is(.flow-wide, .flow-narrow) polygon { fill: #edf3ef;
      stroke: #79a99b;
      stroke-width: 1.4; }
:is(.flow-wide, .flow-narrow) .arrow-head { fill: #79a99b;
      stroke: none; }
</style>

    <title id="fig-tau-title-wide">同一笔退货，两条路径都可能得满分</title>

