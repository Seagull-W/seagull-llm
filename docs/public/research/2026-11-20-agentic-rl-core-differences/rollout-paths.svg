<svg xmlns="http://www.w3.org/2000/svg" width="408" height="552" viewBox="0 0 340 460" role="img" aria-labelledby="title desc">
  <title id="title">同一问答的固定输入与交互式轨迹</title>
  <desc id="desc">固定输入路径用题目和预取资料生成完整回复。交互路径先查作者，把返回的姓名用于查询出生地，再把返回的线索用于作答。两条路径都在提交后按答案给分。</desc>
  <style>
    svg {
      --background: #f0f4f4;
      --node: #fff;
      --text: #263338;
      --line: #50636b;
      --observation: #e0efed;
      --reward: #f5ead9;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --background: #172126;
        --node: #223239;
        --text: #e0e6e6;
        --line: #a5bbc1;
        --observation: #193a3a;
        --reward: #413426;
      }
    }
    text {
      fill: var(--text);
      font: 17px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      text-anchor: middle;
    }
    .label { font-weight: 700; }
    .surface { fill: var(--background); }
    .node { fill: var(--node); stroke: var(--line); }
    .observation { fill: var(--observation); stroke: var(--line); stroke-dasharray: 4 3; }
    .reward { fill: var(--reward); stroke: var(--line); }
    .connector { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .arrowhead { fill: var(--line); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path class="arrowhead" d="M0 0L6 3L0 6Z"/>
    </marker>
  </defs>

  <rect class="surface" width="340" height="460" rx="10"/>
  <rect class="node" x="10" y="10" width="320" height="36" rx="6"/>
  <text class="label" x="170" y="34">这部小说的作者出生在哪个省？</text>
  <path class="connector" d="M170 46V58M84 72V58H256V72"/>

  <g>
    <text class="label" x="84" y="94">固定输入</text>
    <rect class="node" x="10" y="106" width="148" height="40" rx="6"/>
    <text x="84" y="132">题目＋预取资料</text>
    <path class="connector" d="M84 146V166" marker-end="url(#arrow)"/>
    <rect class="node" x="10" y="166" width="148" height="154" rx="6"/>
    <text x="84" y="237">按自身前缀</text>
    <text x="84" y="262">生成完整回复</text>
    <path class="connector" d="M84 320V340" marker-end="url(#arrow)"/>
    <rect class="node" x="10" y="340" width="148" height="38" rx="6"/>
    <text x="84" y="365">提交答案</text>
  </g>

  <g>
    <text class="label" x="256" y="94">交互式路径</text>
    <rect class="node" x="182" y="106" width="148" height="40" rx="6"/>
    <text x="256" y="132">查询小说作者</text>
    <path class="connector" d="M256 146V161" marker-end="url(#arrow)"/>
    <rect class="observation" x="182" y="161" width="148" height="38" rx="6"/>
    <text x="256" y="186">观察：作者姓名</text>
    <path class="connector" d="M256 199V214" marker-end="url(#arrow)"/>
    <rect class="node" x="182" y="214" width="148" height="50" rx="6"/>
    <text x="256" y="234">读到姓名后</text>
    <text x="256" y="256">查询其出生地</text>
    <path class="connector" d="M256 264V279" marker-end="url(#arrow)"/>
    <rect class="observation" x="182" y="279" width="148" height="41" rx="6"/>
    <text x="256" y="305">观察：出生地线索</text>
    <path class="connector" d="M256 320V340" marker-end="url(#arrow)"/>
    <rect class="node" x="182" y="340" width="148" height="38" rx="6"/>
    <text x="256" y="365">据线索提交答案</text>
  </g>

  <path class="connector" d="M84 378V392H256V378"/>
  <path class="connector" d="M170 392V407" marker-end="url(#arrow)"/>
  <rect class="reward" x="10" y="407" width="320" height="43" rx="6"/>
  <text class="label" x="170" y="435">任务奖励：按最终答案给分</text>
</svg>
