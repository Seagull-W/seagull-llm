<svg xmlns="http://www.w3.org/2000/svg" class="flow-narrow flow-narrow" viewBox="0 0 360 648" role="img" aria-labelledby="fig-monitor-narrow-title">
<style>
  text { font-family: "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
  svg { font-size: 17px; }
  :is(.flow-wide, .flow-narrow) text { fill: #26364a;
  font: 400 17px "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
:is(.flow-wide, .flow-narrow) text[data-kind="label"] { fill: #426e63;
  font-weight: 550; }
:is(.flow-wide, .flow-narrow) rect { fill: #fbf9f5;
  stroke: #bfc8c4;
  stroke-width: 1; }
:is(.flow-wide, .flow-narrow) rect[data-tone="training"] { fill: #edf3ef;
  stroke: #79a99b; }
:is(.flow-wide, .flow-narrow) path { fill: none;
  stroke: #79a99b;
  stroke-width: 1.6; }
:is(.flow-wide, .flow-narrow) rect[data-kind="label-bg"] { fill: #f6f1e7;
      stroke: none; }
:is(.flow-wide, .flow-narrow) rect[data-tone="muted"] { fill: #f3f1ec;
      stroke: #c5c9c4; }
:is(.flow-wide, .flow-narrow) rect[data-tone="amber"] { fill: #fdf3e4;
      stroke: #d49442;
      stroke-width: 1.4; }
:is(.flow-wide, .flow-narrow) text[data-kind="amber"] { fill: #7d4a10;
      font-weight: 600; }
:is(.flow-wide, .flow-narrow) path[data-tone="gray"] { stroke: #9aa3a8;
      stroke-width: 1.5; }
:is(.flow-wide, .flow-narrow) path[data-tone="amber-dashed"] { stroke: #c87d28;
      stroke-width: 2;
      stroke-dasharray: 6 4; }
</style>

