<svg xmlns="http://www.w3.org/2000/svg" class="flow-wide flow-wide" viewBox="0 0 860 288" role="img" aria-labelledby="fig-loop-wide-title">
<style>
  text { font-family: "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
  svg { font-size: 20px; }
  :is(.flow-wide, .flow-narrow) text { fill: #26364a;
  font: 400 20px "Noto Sans CJK SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; }
:is(.flow-wide, .flow-narrow) text[data-kind="label"] { fill: #426e63;
  font-weight: 550; }
:is(.flow-wide, .flow-narrow) rect { fill: #fbf9f5;
  stroke: #bfc8c4;
  stroke-width: 1; }
:is(.flow-wide, .flow-narrow) rect[data-tone="training"] { fill: #edf3ef;
  stroke: #79a99b; }
:is(.flow-wide, .flow-narrow) path { fill: none;
  stroke: #79a99b;
  stroke-width: 1.6; }
:is(.flow-wide, .flow-narrow) text { font-size: 16px; }
:is(.flow-wide, .flow-narrow) text[data-kind="group-title"] { fill: #5c6874;
      font-size: 14px;
      font-weight: 550; }
:is(.flow-wide, .flow-narrow) text[data-kind="edge-label"] { fill: #426e63;
      font-size: 14px;
      font-weight: 550; }
:is(.flow-wide, .flow-narrow) rect[data-role="group"] { fill: none;
      stroke: #bfc8c4;
      stroke-dasharray: 5 4; }
:is(.flow-wide, .flow-narrow) rect[data-role="label-bg"] { fill: #f6f1e7;
      stroke: none; }
:is(.flow-wide, .flow-narrow) rect[data-tone="highlight"] { fill: #edf3ef;
      stroke: #426e63;
      stroke-width: 1.8; }
:is(.flow-wide, .flow-narrow) path[data-tone="feedback"] { stroke: #426e63;
      stroke-width: 2.4; }
</style>

    <title id="fig-loop-wide-title">从一道题到下一版策略的训练闭环示意图</title>
